# Stars Delivery production reverse proxy.
#
# Replace api.example.com and certificate paths before
# installing this file on the production host.
#
# The Node application listens on 127.0.0.1-facing port
# 3000 through this single trusted TLS-terminating proxy.

map $http_upgrade $stars_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream stars_delivery_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name api.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.example.com;

    ssl_certificate
        /etc/letsencrypt/live/api.example.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security
        "max-age=31536000"
        always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://stars_delivery_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_set_header Upgrade
            $http_upgrade;

        proxy_set_header Connection
            $stars_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }
}
